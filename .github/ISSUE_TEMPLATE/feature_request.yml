name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and why the app doesn't help today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: official
    attributes:
      label: Official app
      options:
        - label: The headphones' official app can already do this (helps us find the Bluetooth command).
