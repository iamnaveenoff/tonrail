name: Bug report
description: Something in the app doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Sound tab
        2. Tap …
  - type: input
    id: version
    attributes:
      label: App version
      description: The release you installed, e.g. v1.0.0.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostics log
      description: Device → Diagnostics → copy icon, then paste here.
      render: text
