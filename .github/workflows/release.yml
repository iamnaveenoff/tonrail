name: Release

# Builds signed APKs when a version tag is pushed, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64 of the release .jks file
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      - name: Rename artifacts
        run: |
          cd build/app/outputs/flutter-apk
          v="${GITHUB_REF_NAME}"
          mv app-release.apk "tonrail-$v.apk"
          for f in app-*-release.apk; do mv "$f" "tonrail-$v-${f#app-}"; done

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/tonrail-*.apk
