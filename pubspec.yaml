name: tonrail
description: "Tonrail: an open-source Android controller for Bluetooth headphones: noise control, equalizer, buttons and device settings."
repository: https://github.com/iamnaveenoff/tonrail
issue_tracker: https://github.com/iamnaveenoff/tonrail/issues
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.15
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
